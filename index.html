<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Starovnic — arbore genealogic</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- password screen -->
  <main id="lock" class="lock">
    <form id="lock-form" class="lock-card" autocomplete="off">
      <h1>Starovnic</h1>
      <p class="eyebrow">Arbore genealogic de familie</p>
      <label for="pw" class="field-label">Parola familiei</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="check"><input id="remember" type="checkbox" checked> Ține-mă minte pe acest dispozitiv</label>
      <button id="unlock" class="btn btn-primary" type="submit">Intră</button>
      <p id="lock-msg" class="lock-msg" role="alert"></p>
    </form>
    <div class="stamp">otobrothers</div>
  </main>

  <!-- the tree -->
  <div id="app" class="app" hidden>
    <header class="bar">
      <a class="brand" href="#" id="brand">Starovnic</a>
      <div class="search">
        <label for="q" class="sr-only">Caută o persoană</label>
        <input id="q" type="search" placeholder="Caută o persoană…" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
      <label for="line" class="sr-only">Linia familiei</label>
      <select id="line" class="select"><option value="">Toate liniile</option></select>
      <button id="logout" class="btn btn-ghost" type="button">Ieșire</button>
    </header>

    <div id="viewport" class="viewport">
      <div id="world" class="world">
        <svg id="lines" class="lines" aria-hidden="true"></svg>
        <div id="cards"></div>
      </div>
      <div class="zoom">
        <button class="btn btn-icon" id="zoom-in" type="button" aria-label="Mărește">+</button>
        <button class="btn btn-icon" id="zoom-out" type="button" aria-label="Micșorează">−</button>
        <button class="btn" id="fit" type="button">Tot arborele</button>
      </div>
      <div class="stamp stamp-app">otobrothers</div>
    </div>

    <aside id="panel" class="panel" hidden aria-labelledby="p-name">
      <button id="close" class="btn btn-icon close" type="button" aria-label="Închide">×</button>
      <div id="panel-body"></div>
    </aside>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="btn btn-icon close" id="lb-close" type="button" aria-label="Închide">×</button>
    <img id="lb-img" alt="">
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
